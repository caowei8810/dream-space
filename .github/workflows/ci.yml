name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dreamspace:dreamspace_ci@localhost:5432/dreamspace
      MOCK_GENERATION_DELAY_MS: 1000
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dreamspace
          POSTGRES_PASSWORD: dreamspace_ci
          POSTGRES_USER: dreamspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dreamspace -d dreamspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Docker Compose
        run: docker compose -f infrastructure/docker/compose.yml config --quiet
      - name: Check formatting
        run: pnpm format:check
      - name: Run project checks
        run: pnpm check
      - name: Apply database migrations
        run: pnpm --filter @dream-space/db exec prisma migrate deploy
      - name: Run authentication and generation integration smoke
        run: |
          pnpm --filter @dream-space/api start > /tmp/dreamspace-api.log 2>&1 &
          api_pid=$!
          pnpm --filter @dream-space/worker start > /tmp/dreamspace-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/health > /dev/null; then
              pnpm auth:smoke
              pnpm generation:smoke
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dreamspace-api.log
          cat /tmp/dreamspace-worker.log
          exit 1
